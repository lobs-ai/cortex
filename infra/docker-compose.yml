services:
  app:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Force production regardless of .env — the prod image ships the
      # prebuilt Next bundle and doesn't carry dev-mode loaders.
      CORTEX_ENV: "production"
      NODE_ENV: "production"
      PORT: "9009"
      CORTEX_DB_PATH: /data/cortex.db
    volumes:
      - cortexdata:/data
    ports:
      - "9009:9009"

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      CORTEX_DB_PATH: /data/cortex.db
    volumes:
      - cortexdata:/data

volumes:
  cortexdata: {}
